# Optional but recommended:  uv run pre-commit install
#
# Deliberately limited to fast, local checks. Tests are not run here; they
# belong in CI, where a slow hook cannot discourage committing.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # Raw data must never be committed. .gitignore handles it; this is the
      # backstop for an accidental `git add -f`.
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
