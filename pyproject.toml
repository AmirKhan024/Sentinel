[project]
name = "sentinel"
version = "0.1.0"
description = "Risk-prioritized food inspection scheduling using Chicago open data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Runtime dependencies are deliberately minimal. Technologies are introduced
# only when the component that needs them is actually being built.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

# --- Ruff ----------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# --- mypy ----------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/sentinel", "scripts"]

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

# --- pytest --------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests hit the real Chicago Data Portal. They are deselected by default
# so the normal test run and CI never depend on an external service.
addopts = "-m 'not live'"
markers = [
    "live: test performs a real network call to the Chicago Data Portal",
]
